[project]
name = "odins-eye"
version = "0.1.0"
description = "Odin's Eye v4: offline dense-crowd tracking and crowd-state estimation (Phase 1)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Taha Oguzhan Ucar" }]

# Phase 1 runtime deps only (M1 perception + M2 crowd state + evaluation).
# Phase 2+ deps (transformers, vllm, faiss, mlx-vlm) are added when that phase starts.
dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "ultralytics>=8.4.0",            # YOLO26 needs 8.4+
    "boxmot>=26.0",                  # ByteTrack / OC-SORT / BoT-SORT / Deep OC-SORT + OSNet
    "trackeval==1.3.0",              # maintained PyPI fork of TrackEval (NumPy 2 safe), same pin as BoxMOT
    "numpy>=2.2",
    "scipy>=1.13",
    "pandas>=2.2,<3",
    "pyarrow>=18,<24",               # Parquet I/O
    "opencv-python",
    "hydra-core>=1.3",               # run configs
    "pydantic>=2.7",                 # schemas
    "duckdb>=1.1",                   # SQL over Parquet (ad-hoc analysis now, M6 later)
    "matplotlib>=3.8",
    "tqdm",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pre-commit>=3.7",
    "ipykernel",                     # notebooks/ exploration only
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/odins_eye"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]          # tests import src/ directly, independent of the editable .pth
addopts = "-q"
